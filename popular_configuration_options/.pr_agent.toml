[config]
disable_auto_feedback = false # set to true to disable automatic comments; when disabled, tools can still be manually triggered via commands (e.g. /agentic_review)
add_repo_metadata = true # if true, use metadata from files like 'AGENTS.MD', 'CLAUDE.MD', etc.
add_repo_metadata_file_list = ["AGENTS.md", "CLAUDE.md"] # list of files to look for when adding repo metadata

[github_app] # Comment/remove this line if not using GitHub; use alternate git provider below
# [gitlab] # Uncomment this line if using GitLab instead of GitHub
# [bitbucket_app] # Uncomment this line if using Bitbucket Cloud instead of GitHub
# [bitbucket_server] # Uncomment this line if using Bitbucket Datacenter instead of GitHub
pr_commands = [ # list of tools to trigger automatically when a new PR is created
    "/agentic_describe",
    "/agentic_review"
]
handle_push_trigger = false # updates Qodo comments with every new commit
push_commands = [ # list of tools to trigger upon each new commit; requires line above to be set to true
    "/agentic_describe",
    "/agentic_review",
]
feedback_on_draft_pr = true # for GitHub only; set to true to get automated feedback on draft PRs

[review_agent] # /agentic_review configuration

# "summary" = only one not inline comment
# "inline" = only inline comments
# "both" [DEFAULT] = inline comments + summary comment
comments_location_policy = "both"

# severity threshold rank for inline comments: 
# 3 [DEFAULT] = only action required as inline comments
# 2 = only action required + remediation recommended 
# 1 = all suggestions posted as inline comments
# Only findings with rank >= threshold will be published inline
inline_comments_severity_threshold = 3

# Extra prompt to be added as instruction for the agent, for outlier scenarios
issues_extra_instructions = ""
compliance_extra_instructions = ""

# Self-review checkbox
demand_self_review = false  # add a checkbox for the author to self-review the code review findings
self_review_text = "**Author self-review**: I have reviewed the code review findings, and addressed the relevant ones."
approve_pr_on_self_review = false  # If true, the PR will be auto-approved after the author clicks on the self-review checkbox

[pr_description] # /agentic_describe configuration

extra_instructions = ""
enable_pr_diagram = true # set to false to disable mermaid diagram
